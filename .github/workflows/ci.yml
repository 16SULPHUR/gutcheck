name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install CPU torch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install gutcheck
        run: uv pip install -e ".[dev]"
      - run: pytest -q

  e2e:
    # real Laya weights, cached between runs; also runs the pack evals against committed baselines
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          activate-environment: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/gutcheck
          key: hf-laya-v2-${{ hashFiles('pyproject.toml', 'src/gutcheck/packs/**/pack.yaml') }}
          restore-keys: hf-laya-v2-
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e ".[dev]"
      - name: Run e2e tests (fails if they were skipped)
        shell: bash
        env:
          RUN_LAYA_E2E: "1"
        run: |
          pytest tests/e2e -rA | tee e2e.txt
          grep -q "2 passed" e2e.txt && ! grep -q "skipped" e2e.txt
      - name: Evaluate packs
        id: eval
        shell: bash
        env:
          GUTCHECK_ENGINE__DEVICE: cpu
        run: |
          set +e
          gutcheck eval --check --summary eval-summary.md > eval.md 2> eval.err
          echo "status=$?" >> "$GITHUB_OUTPUT"
          touch eval-summary.md
          cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 eval.err
      - name: Post eval results on the PR
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- gutcheck-eval -->';
            const status = '${{ steps.eval.outputs.status }}' === '0' ? 'passed' : 'failed';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const log = fs.readFileSync('eval.err', 'utf8').trim().split('\n').slice(-40).join('\n');
            const body = `${marker}\n# Pack evals: ${status}\n\n` +
              `Commit ${sha}, real Laya on CPU.\n\n` +
              fs.readFileSync('eval-summary.md', 'utf8') +
              `\n<details><summary>Log (last 40 lines)</summary>\n\n\`\`\`\n${log}\n\`\`\`\n\n</details>\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const mine = comments.find(c => c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail if evals regressed
        if: steps.eval.outputs.status != '0'
        run: exit 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU image
        run: docker build -t gutcheck:ci .
      - name: Smoke test
        run: |
          # skip the model download; the e2e job covers real inference
          docker run -d --name gutcheck -p 8080:8080 -e "GUTCHECK_ENGINE__MODELS=[]" gutcheck:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/healthz; then exit 0; fi
            sleep 2
          done
          docker logs gutcheck
          exit 1

  docker-gpu:
    # CUDA wheels are several GB, so the GPU image is built on demand and for tags only
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GPU image
        run: docker build -t gutcheck:gpu --build-arg TORCH_VARIANT=cu126 .
