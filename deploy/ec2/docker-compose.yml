services:
  gutcheck:
    build:
      context: ../../space
      args:
        GUTCHECK_REF: ${GUTCHECK_REF:-master}
    restart: unless-stopped
    environment:
      SITE_ORIGINS: ${SITE_ORIGINS:-https://gutcheck-blush.vercel.app}
    expose:
      - "7860"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - gutcheck

volumes:
  caddy_data:
